<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Background with White Icons</title>
    <!-- This line imports the Font Awesome icon library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Sets the background color of the page */
        body {
            background-color: #007bff; /* A standard blue color */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 30px; /* Adds space between the icons */
        }

        /* Styles the icons */
        .icon {
            color: white; /* Makes the icons white */
            font-size: 48px; /* Sets the size of the icons */
        }
    </style>
</head>
<body>

    <!-- You can add or change icons here -->
    <i class="fas fa-home icon"></i>
    <i class="fas fa-user icon"></i>
    <i class="fas fa-cog icon"></i>
    <i class="fas fa-envelope icon"></i>

</body>
</html>
